<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="supported-color-schemes" content="dark light">
<title>Seu c&#243;digo de confirma&#231;&#227;o</title>
</head>
<body style="margin:0;padding:0;background:#0B0B0B;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#0B0B0B;font-size:1px;line-height:1px;">Use este c&#243;digo para confirmar a a&#231;&#227;o no Fluxo.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0B0B0B" style="background:#0B0B0B;">
  <tr><td align="center" style="padding:40px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
      <tr><td align="center" style="padding:0 0 28px 0;">
        <img src="https://appfluxo.app.br/branding/email-logo.png" width="150" alt="Fluxo" style="display:block;border:0;outline:none;height:auto;width:150px;">
      </td></tr>
      <tr><td bgcolor="#141218" style="background:#141218;border:1px solid #2A2630;border-radius:20px;padding:40px 36px 32px 36px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr><td style="padding:0 0 14px 0;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:26px;line-height:32px;font-weight:800;letter-spacing:-0.4px;color:#FFFFFF;">Seu c&#243;digo de confirma&#231;&#227;o</td></tr>
          <tr><td style="padding:0 0 28px 0;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:25px;color:#BDB7C9;">Digite o c&#243;digo abaixo no Fluxo para confirmar a a&#231;&#227;o. Ele vale por poucos minutos.</td></tr>
              <tr><td align="center" style="padding:0 0 24px 0;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
                  <td align="center" bgcolor="#1C1822" style="background:#1C1822;border:1px solid #3A3446;border-radius:14px;padding:16px 32px;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:34px;line-height:40px;font-weight:700;letter-spacing:10px;color:#FFFFFF;">{{ .Token }}</td>
                </tr></table>
              </td></tr>
              <tr><td style="text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#8D86A0;">
                N&#227;o pediu este c&#243;digo? Ignore este e-mail.
              </td></tr>
        </table>
      </td></tr>
      <tr><td align="center" style="padding:26px 12px 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:19px;color:#6F6A7B;">
        Voc&#234; recebeu este e-mail porque algu&#233;m usou este endere&#231;o no Fluxo.<br>
        <a href="https://appfluxo.app.br" target="_blank" style="color:#8D86A0;text-decoration:none;">appfluxo.app.br</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
