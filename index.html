  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsla(210, 40%, 98%, 0.72);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      transition: opacity 0.35s ease;
    }
    #app-splash.app-splash-dark {
      background: hsla(0, 0%, 7%, 0.72);
    }
    #app-splash img {
      width: 220px;
      max-width: 60vw;
      animation: app-splash-pulse 1.6s ease-in-out infinite;
    }
    #app-splash .app-splash-logo-dark {
      display: none;
    }
    #app-splash.app-splash-dark .app-splash-logo-light {
      display: none;
    }
    #app-splash.app-splash-dark .app-splash-logo-dark {
      display: block;
    }
    @keyframes app-splash-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.96); }
    }
    #app-splash.app-splash-hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

  <body>
    <div id="app-splash">
      <img class="app-splash-logo-light" src="/branding/uau-logo-light.png" alt="Uau Digital" />
      <img class="app-splash-logo-dark" src="/branding/uau-logo-dark.png" alt="Uau Digital" />
    </div>
    <script>
      // Runs synchronously before first paint — matches the splash background to whatever
      // theme next-themes last stored (storageKey "uau-theme"), so it doesn't flash the
      // wrong color before React mounts and applies the real theme class.
      window.__splashStart = performance.now();
      try {
        if (localStorage.getItem("uau-theme") === "dark") {
          document.getElementById("app-splash").classList.add("app-splash-dark");
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
